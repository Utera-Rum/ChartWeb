<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChartWeb</title>
<meta name="theme-color" content="#131722">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ChartWeb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"
        integrity="sha384-OK7vELvjHdhUFi31JYioPIcRHTROLdcDa6ZsNWgvgLaKj+9JqhU0Ad8g4wz3CXjA"
        crossorigin="anonymous"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<header>
  <select id="pair" aria-label="銘柄"></select>
  <div class="px"><span id="price">-</span><span id="chg"></span></div>
  <button id="settingsBtn" aria-label="設定" title="設定">⚙</button>
</header>

<nav id="tfs" aria-label="時間足"></nav>

<section id="bar" aria-live="polite">
  <span id="pill" class="pill">…</span>
  <span id="scoreText"></span>
  <span id="lastSig"></span>
</section>

<div class="chips" id="chips"></div>
<div id="main" class="chart"></div>

<div class="chips" id="subtabs"></div>
<div id="sub" class="chart small"></div>

<section id="detail">
  <h2><span id="detailTitle">判定の内訳</span> <button id="latestBtn" hidden>最新の足に戻す</button></h2>
  <ul id="rules"></ul>
</section>

<footer>
  <div id="status" role="status"></div>
  <p>データ: bitbank 公開API（遅延・欠けがあり得ます）。売買判定は目安で、投資の助言ではありません。</p>
</footer>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2>判定の設定</h2>
    <fieldset><legend>使うルール</legend><div id="ruleBoxes"></div></fieldset>
    <div class="grid">
      <label>買い基準（スコア以上）<input name="buyTh" type="number" step="1" inputmode="numeric"></label>
      <label>売り基準（スコア以下）<input name="sellTh" type="number" step="1" inputmode="numeric"></label>
      <label>RSI 売られすぎ<input name="rsiLo" type="number" step="1" inputmode="numeric"></label>
      <label>RSI 買われすぎ<input name="rsiHi" type="number" step="1" inputmode="numeric"></label>
      <label>出来高 急増（平均の何倍）<input name="volMult" type="number" step="0.1" inputmode="decimal"></label>
      <label>出来高 平均の本数<input name="volLen" type="number" step="1" min="1" inputmode="numeric"></label>
    </div>
    <div class="row">
      <button type="button" id="resetBtn">初期値に戻す</button>
      <span class="grow"></span>
      <button type="button" id="cancelBtn">閉じる</button>
      <button type="submit" id="okBtn" class="primary">保存</button>
    </div>
  </form>
</dialog>
</body>
</html>
